<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101016" />
  <title>NovaChat — Conecta sin límites</title>
    <link rel="stylesheet" href="src/css/main.css" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark"></span>NovaChat</div>
        <div class="action-row">
          <button class="icon-btn" title="Nuevo chat" id="topNewChat"><svg class="icon"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="icon-btn" title="Opciones" id="settingsBtn"><svg class="icon"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></button>
        </div>
      </div>
      <label class="search"><svg class="icon" style="width:17px"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="searchInput" type="search" placeholder="Buscar conversaciones" autocomplete="off" /></label>
      <nav class="tabs">
        <button class="tab active" data-tab="chats">Chats</button><button class="tab" data-tab="states">Estados</button><button class="tab" data-tab="calls">Llamadas</button>
      </nav>
      <div class="contact-list" id="contactList"></div>
      <button class="new-chat" id="newChatBtn" title="Iniciar una conversación"><svg class="icon" style="width:22px"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>
    </aside>

    <main class="main" id="mainPanel">
      <section class="chat-header" id="chatHeader">
        <div class="person"><button class="icon-btn mobile-back" id="backBtn"><svg class="icon"><path d="m15 18-6-6 6-6"/></svg></button><div class="avatar a1 large" id="headerAvatar">LM<span class="online-dot"></span></div><div class="person-details"><h1 id="headerName">Laura Medina</h1><p id="headerStatus">en línea</p></div></div>
        <div class="header-actions"><button class="icon-btn" title="Videollamada" id="videoBtn"><svg class="icon"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 5-3v10l-5-3"/></svg></button><button class="icon-btn" title="Llamada" id="callBtn"><svg class="icon"><path d="M22 16.9v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.62 2.62a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.28-1.28a2 2 0 0 1 2.11-.45c.85.29 1.72.5 2.62.62A2 2 0 0 1 22 16.9Z"/></svg></button><button class="icon-btn" title="Más opciones" id="infoBtn"><svg class="icon"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button></div>
      </section>
      <section class="messages" id="messages"></section>
      <div class="typing" id="typing">Laura está escribiendo...</div>
      <form class="composer" id="composer"><button type="button" class="compose-icon" id="attachBtn" title="Adjuntar"><svg class="icon"><path d="m21.4 11.6-8.7 8.7a6 6 0 0 1-8.5-8.5l8.7-8.7a4 4 0 0 1 5.7 5.7l-8.7 8.7a2 2 0 0 1-2.8-2.8l8-8"/></svg></button><div class="input-wrap"><input class="message-input" id="messageInput" placeholder="Escribe un mensaje" autocomplete="off" /><button type="button" class="compose-icon" id="emojiBtn" title="Emoji">☺</button></div><button class="send" aria-label="Enviar mensaje"><svg class="icon"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
      <div class="call-screen" id="callScreen"><div class="avatar a1" id="callAvatar">LM</div><h2 id="callName">Laura Medina</h2><p id="callState">Llamando...</p><p class="call-duration" id="callDuration">00:00</p><div class="call-controls"><button class="call-control" id="muteBtn" title="Silenciar"><svg class="icon"><path d="M12 1v11a3 3 0 0 1-6 0V7"/><path d="M18 10v2a6 6 0 0 1-12 0"/><path d="M9 18v4M6 22h6"/></svg></button><button class="call-control" id="speakerBtn" title="Altavoz"><svg class="icon"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg></button><button class="call-control end" id="endCallBtn" title="Finalizar"><svg class="icon"><path d="M4.9 16.1a15.2 15.2 0 0 1 14.2 0l1.6-1.6a2 2 0 0 0-.1-2.9 13.1 13.1 0 0 0-17.2 0 2 2 0 0 0-.1 2.9Z"/></svg></button></div></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle">Nuevo chat</h2><button class="icon-btn" id="closeModal"><svg class="icon"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="modalText">Busca a una persona o crea un grupo para comenzar una nueva conversación.</p><input class="modal-field" id="newChatName" placeholder="Nombre del contacto o grupo" /><div class="modal-actions"><button class="cancel" id="cancelModal">Cancelar</button><button class="primary" id="modalPrimary">Crear chat</button></div></div></div>
  <div class="toast" id="toast"></div>

    <script src="src/js/app.js"></script>
</body>
</html>
